[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; apache2-foreground est le script officiel de l'image php:apache : il gere
; correctement les signaux (SIGTERM/SIGWINCH) sans dupliquer de processus.
; L'ancien wrapper "bash -c apache2ctl -D FOREGROUND" pouvait entrainer une
; boucle de redemarrage : un SIGHUP recu par le master Apache declenchait un
; rechargement interne pendant que supervisord, croyant le processus mort,
; en relancait un second qui echouait avec "Address already in use".
[program:apache2]
command=apache2-foreground
autostart=true
autorestart=unexpected
exitcodes=0
startretries=10
startsecs=3
stopsignal=WINCH
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
killasgroup=true
stopasgroup=true

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
